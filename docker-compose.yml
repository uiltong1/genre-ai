services:
  frontend:
    build:
      context: ./genre-ai-frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./genre-ai-frontend/src:/app/src
      - ./genre-ai-frontend/public:/app/public
      - ./genre-ai-frontend/tailwind.config.js:/app/tailwind.config.js
      - ./genre-ai-frontend/postcss.config.js:/app/postcss.config.js
    env_file:
      - ./genre-ai-frontend/.env
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    stdin_open: true
    tty: true
    restart: unless-stopped
